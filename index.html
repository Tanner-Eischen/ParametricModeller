<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parametric Modeler</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar"></header>
      <div id="workspace">
        <aside id="panel-left" aria-label="Model browser"></aside>
        <main id="viewport" aria-label="3D modeling viewport" tabindex="0"></main>
        <aside id="panel-right" aria-label="Context inspector"></aside>
      </div>
      <footer id="status-bar">
        <span id="status-left">Ready</span>
        <span id="status-center" role="status"></span>
        <span id="status-right">Units: Inches</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
