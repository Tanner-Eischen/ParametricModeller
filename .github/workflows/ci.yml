name: Core release verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Install Chromium for the frame workflow
        # The hosted Ubuntu image already supplies Chromium's shared libraries.
        # Installing optional font packages via apt stalled on the runner mirror.
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Verify the browser frame workflow
        run: npx playwright test tests/e2e/frame-example-workflow.spec.ts
      - run: npm run export:portfolio-frame -- --out release/artifacts/sample-frame
      - run: npm run release:web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-release-evidence
          path: |
            coverage/
            release/artifacts/
            playwright-report/
            test-results/
# The broad browser suite remains available in browser-manual.yml.
